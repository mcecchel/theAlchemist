<!DOCTYPE html>
<html lang="it">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{PAGE_TITLE}}</title>
	<meta name="description" content="{{PAGE_DESC}}">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/fonts.css">
	<link rel="stylesheet" href="css/style.css">
	<script>
	(function(){
		try{
			var params = new URLSearchParams(location.search);
			if (params.has('reset')){
				localStorage.removeItem('mc-lens');
			} else {
				var l = params.get('lens') || localStorage.getItem('mc-lens');
				if (l === 'design' || l === 'dev') document.documentElement.setAttribute('data-lens', l);
			}
		} catch(e){}
	})();
	</script>
</head>
<body>

<a href="#top" class="skip-link">Salta al contenuto principale</a>

<div class="lens-gate">
	<canvas id="gate-particles-canvas" class="particles-canvas" aria-hidden="true"></canvas>
	<p class="hero-eyebrow">Marianna Cecchelli — Firenze</p>
	<h1>Di cosa hai bisogno?</h1>
	<div class="lens-picker" role="group" aria-label="Scegli il profilo da cui guardare il portfolio">
		<button type="button" class="lens-card is-design" data-set-lens="design" aria-pressed="false">
			<span class="lc-kicker">Profilo 01</span>
			<h2>Designer</h2>
			<p>Brand identity, sistemi tipografici, direzione visiva. IED Firenze, 110/110.</p>
			<p class="lc-stack">Adobe CC · Figma · Brand guidelines</p>
		</button>
		<button type="button" class="lens-card is-dev" data-set-lens="dev" aria-pressed="false">
			<span class="lc-kicker">Profilo 02</span>
			<h2>Developer</h2>
			<p>Full-stack: front-end, back-end, API. 42 Firenze, oggi in aerospace &amp; defense.</p>
			<p class="lc-stack">JS/TS · Python · FastAPI · Node · Git</p>
		</button>
	</div>
</div>

<div class="lens-sweep" aria-hidden="true"></div>

<header class="site-header">
	<a href="index.html" class="logo"><img src="assets/img/logo.png" alt="Marianna Cecchelli" class="logo-img"></a>
	<div class="lens-pill">
		<span>Profilo: <b id="lens-name">—</b></span>
		<button type="button" id="lens-swap">ribalta</button>
	</div>
	<nav class="nav" id="site-nav">
		<a href="index.html">Home</a>
		<a href="about.html">About</a>
		<a href="portfolio.html">Portfolio</a>
		<a href="contatti.html">Contatti</a>
	</nav>
	<button class="nav-toggle" aria-label="Apri menu" aria-expanded="false" aria-controls="site-nav">
		<span></span><span></span><span></span>
	</button>
</header>

<main id="top">
{{CONTENT}}
</main>

<footer class="site-footer">
	<div class="row-inner">
		<p>© <span id="year"></span> Marianna Cecchelli</p>
		<p>Firenze — contenuti e progetti in aggiornamento</p>
	</div>
</footer>

<script src="js/script.js"></script>
</body>
</html>
